<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Phyon 登入
    </title>

    <style>

        :root {
            --primary: #2563a6;
            --primary-dark: #1f4f84;
            --accent: #0f766e;
            --bg: #f4f6f8;
            --card: #ffffff;
            --border: #d8dee5;
            --text: #243746;
            --muted: #6b7280;
            --danger-bg: #fff1f2;
            --danger-border: #fecdd3;
            --danger-text: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family:
                "Microsoft JhengHei",
                "Noto Sans TC",
                Arial,
                sans-serif;
            color: var(--text);
        }

        .login-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow:
                0 8px 24px
                rgba(36, 55, 70, 0.08);
        }

        .system-title {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
        }

        .system-subtitle {
            margin-top: 8px;
            margin-bottom: 28px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            min-height: 42px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 15px;
            background: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 166, 0.12);
        }

        .error-box {
            margin-bottom: 18px;
            padding: 10px 12px;
            border: 1px solid var(--danger-border);
            border-radius: 7px;
            background: var(--danger-bg);
            color: var(--danger-text);
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            min-height: 44px;
            border: none;
            border-radius: 7px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: var(--primary-dark);
        }

        .dev-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .dev-title {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
        }

        .dev-text {
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }

        .dev-button {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--accent);
            border-radius: 7px;
            background: #fff;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
        }

        .dev-button:hover {
            background: #f0fdfa;
        }

    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <h1 class="system-title">
                Phyon
            </h1>

            <div class="system-subtitle">
                環境檢測分析與品質管制系統
            </div>

            {% if error_message %}

            <div class="error-box">
                {{ error_message }}
            </div>

            {% endif %}

            <form
                method="post"
                action="{{ url_for('login') }}"
            >

                <div class="form-group">

                    <label
                        for="user_id"
                        class="form-label"
                    >
                        帳號
                    </label>

                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        class="form-control"
                        autocomplete="username"
                    >

                </div>

                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        密碼
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        autocomplete="current-password"
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    登入
                </button>

            </form>

            <div class="dev-box">

                <div class="dev-title">
                    開發測試模式
                </div>

                <div class="dev-text">
                    目前在非公司環境時，可使用測試身分建立登入 Session。
                    回公司後會改由 LIMS SYS_USER / EMPLOY 驗證。
                </div>

                <form
                    method="post"
                    action="{{ url_for('dev_login') }}"
                >

                    <button
                        type="submit"
                        class="dev-button"
                    >
                        使用測試人員登入
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
